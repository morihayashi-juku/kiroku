<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="進度ボード">
<meta name="robots" content="noindex,nofollow">
<title>プリント進度ボード</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@700;900&display=swap" rel="stylesheet">
<style>
/* VOICE: 塾の先生の手元の台帳。見るだけで「だれが今どこか」がわかる
   IDEA: 職員室の進度表。教材サイトの記録を自動で写した一覧に、済のはんこが並ぶ
   PICTURE: 組ごとのカード（今ここ・今の回・はんこ・これまでの回の列）
   COLOUR and TYPE: 白い紙と墨色、英語は藍、数学は朱、はんこは朱。Zen Maru Gothic＋BIZ UDPGothic
   LAYOUT: 上に細いバー（切りかえ・絞り込み）、学年ごとの見出しの下にカードの格子。iPad mini縦で2列 */
:root{color-scheme:light dark;
--bg:light-dark(#f6f4ee,#14161a);--paper:light-dark(#fff,#1d2026);--ink:light-dark(#1d2027,#ebe8e1);
--sub:light-dark(#5b606c,#a5a9b2);--rule:light-dark(#e2ded3,#323641);--soft:light-dark(#efece4,#262a32);
--en:light-dark(#2643c2,#93a6ff);--ma:light-dark(#cf431c,#ff8d6a);--sha:light-dark(#2c7a4b,#7fd09d);
--stamp:light-dark(#d1372a,#ff7a6a);--doing:light-dark(#b87b00,#f2c14e)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.55 "BIZ UDPGothic",system-ui,sans-serif;overflow-x:clip}
button,input{font:inherit;color:inherit}
h1,h2,h3{font-family:"Zen Maru Gothic","BIZ UDPGothic",sans-serif;margin:0;line-height:1.2}
a{color:inherit}
[data-k=en]{--c:var(--en)}[data-k=ma]{--c:var(--ma)}[data-k=sha]{--c:var(--sha)}
.top{position:sticky;top:0;z-index:5;background:var(--paper);border-bottom:1px solid var(--rule);padding:10px max(3vw,12px)}
.row1{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.today{margin-right:auto;display:grid;gap:0}
.today h1{font-size:13px;font-weight:700;color:var(--sub);font-family:"BIZ UDPGothic",sans-serif}
.dt{font:900 30px/1.15 "Zen Maru Gothic",sans-serif;font-variant-numeric:tabular-nums}
.dt .w{color:var(--stamp)}.dt .w.sat{color:var(--en)}
.tc{font-size:14px;font-weight:700}
.tc span{color:var(--sub);font-weight:400}
.tabs{display:flex;background:var(--soft);border-radius:12px;padding:3px}
.tabs a{padding:8px 12px;border-radius:9px;text-decoration:none;font-weight:700;font-size:15px;min-height:40px;display:flex;align-items:center;white-space:nowrap}
.tabs a[aria-current]{background:var(--paper);box-shadow:0 1px 3px rgb(0 0 0/.12)}
.row2{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px;align-items:center}
.seg{display:flex;gap:4px;flex-wrap:wrap}
.seg button{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:6px 12px;min-height:38px;cursor:pointer;font-size:15px}
.seg button[aria-pressed=true]{background:var(--c,var(--ink));border-color:var(--c,var(--ink));color:var(--paper);font-weight:700}
.stamp-t{margin-left:auto;font-size:13px;color:var(--sub);display:flex;gap:8px;align-items:center}
.btn{border:0;border-radius:10px;padding:8px 12px;min-height:40px;font-weight:700;cursor:pointer;background:var(--soft);color:var(--ink)}
input[type=search]{border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:8px 12px;min-height:46px;font-size:16px;width:100%}
:focus-visible{outline:3px solid var(--en);outline-offset:2px}
main{padding:16px max(3vw,12px) 40px;max-width:1240px;margin:0 auto}
.grade{margin-bottom:26px}
.grade>h2{font-size:20px;font-weight:900;margin-bottom:8px}
.grade>h2 small{font:14px "BIZ UDPGothic",sans-serif;color:var(--sub)}
.rows{background:var(--paper);border:1px solid var(--rule);border-radius:14px;overflow:hidden}
.row{border-top:1px solid var(--rule)}
.row:first-child{border-top:0}
.row>summary{list-style:none;display:grid;grid-template-columns:7.2em 1fr auto;gap:12px;align-items:center;padding:10px 14px;cursor:pointer;min-height:60px;border-left:5px solid var(--c)}
.row>summary::-webkit-details-marker{display:none}
.row[open]>summary{background:var(--soft)}
.who{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.who b{font:900 20px/1.15 "Zen Maru Gothic",sans-serif}
.sj{font-size:12px;font-weight:700;color:var(--c)}
.what{display:block;line-height:1.4}
.what .lb{font:900 17px "Zen Maru Gothic",sans-serif;color:var(--c);margin-right:6px}
.what .tt{font-weight:700;font-size:16px}
.what .tt.none{color:var(--sub);font-weight:400}
.what .nw{display:block;font-size:13px;color:var(--sub);margin-top:2px}
.side{display:flex;gap:6px;align-items:center}
.hk{flex:none;width:28px;height:28px;border-radius:50%;border:3px double var(--stamp);color:var(--stamp);display:grid;place-items:center;font:900 12px "Zen Maru Gothic",sans-serif;transform:rotate(-12deg)}
.upd{font-size:13px;color:var(--sub);white-space:nowrap;font-variant-numeric:tabular-nums}
.upd.warn{color:var(--stamp);font-weight:700}
.more{padding:6px 14px 4px calc(14px + 5px + 7.2em + 12px);border-left:5px solid var(--c)}
.prints{list-style:none;margin:0;padding:0;font-size:14px}
.prints li{padding:4px 0;border-top:1px dashed var(--rule);display:flex;gap:8px}
.prints li:first-child{border-top:0}
.prints .k{flex:none;font-size:12px;color:var(--sub);min-width:3.5em;padding-top:2px}
.hl{list-style:none;margin:10px 0 0;padding:8px 0 0;font-size:13px;border-top:1px solid var(--rule);color:var(--sub)}
.hl li{display:flex;gap:8px;padding:2px 0;align-items:baseline}
.hl .lb{flex:none;font-weight:700;min-width:3.2em}
.hl .t{flex:1}
.hl .ok{flex:none;color:var(--stamp);font-weight:700}
.mm{margin:8px 0 0;font-size:13px;color:var(--sub)}
.open{display:block;text-align:right;padding:8px 0 10px;font-size:14px;font-weight:700;color:var(--c);text-decoration:none}
.acts{display:flex;gap:8px;margin:10px 0 4px}
.acts .btn{border:1px solid var(--rule);background:var(--paper)}
.abs-b{color:var(--stamp)!important;border-color:var(--stamp)!important}
.lg{list-style:none;margin:8px 0 0;padding:0;font-size:13px}
.lg li{display:flex;gap:8px;align-items:center;padding:4px 0;border-top:1px dashed var(--rule)}
.lg .d{flex:none;color:var(--sub);min-width:4.8em}
.lg .x{flex:1;display:flex;gap:6px;align-items:center}
.x-b{flex:none;background:none;border:1px solid var(--rule);border-radius:8px;color:var(--sub);font-size:12px;padding:4px 8px;min-height:32px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgb(0 0 0/.42);display:grid;place-items:center;z-index:10;padding:12px}
.panel{background:var(--paper);border-radius:18px;padding:20px;width:min(560px,100%);max-height:calc(100vh - 24px);overflow:auto;display:grid;gap:12px}
.panel h2{font-size:22px}
.panel label{display:grid;gap:4px;font-weight:700;font-size:14px}
.panel input[type=text],.panel input[type=date],.panel input[type=password],.panel textarea{border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:8px 10px;min-height:44px;font-size:16px;font-family:inherit;color:inherit}
.mh{margin:0;font-size:14px;color:var(--sub);line-height:1.6}
.mb{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.pri{background:var(--ink)!important;color:var(--paper)!important}
.pri:disabled{opacity:.6}
.err-m{margin:0;color:var(--stamp);font-weight:700;font-size:14px}
.howto{padding:0;font-size:14px;line-height:1.7}.howto ol{padding-left:1.4em;margin:6px 0}.howto summary{font-weight:700;color:var(--ink)}
.note{position:fixed;left:50%;bottom:16px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:10px;font-size:14px;max-width:92vw;z-index:20}
.err{background:color-mix(in srgb,var(--stamp) 12%,var(--paper));border:1px solid var(--stamp);border-radius:12px;padding:10px 14px;margin-bottom:14px;font-size:14px}
.day{margin-bottom:18px;max-width:860px}
.day h2{font-size:22px;font-weight:900;margin-bottom:6px;display:flex;align-items:baseline;gap:8px;font-variant-numeric:tabular-nums}
.wd{font-size:.8em;color:var(--sub);font-weight:700}.wd.sun{color:var(--stamp)}.wd.sat{color:var(--en)}
.tdl{font:700 13px "BIZ UDPGothic",sans-serif;background:var(--ink);color:var(--paper);border-radius:6px;padding:2px 8px}
.tl{list-style:none;margin:0;padding:0;background:var(--paper);border:1px solid var(--rule);border-radius:12px;overflow:hidden}
.tl li{display:grid;grid-template-columns:7em 1fr;gap:10px;padding:10px 14px;border-top:1px solid var(--rule);align-items:baseline;border-left:5px solid var(--c)}
.tl li:first-child{border-top:0}
.tl .w{font-weight:900;font-family:"Zen Maru Gothic",sans-serif;color:var(--c);display:flex;flex-direction:column}
.tl .w small{font:12px "BIZ UDPGothic",sans-serif;color:var(--sub)}
.tl .x{display:flex;gap:8px;align-items:center}
.tl li.abs{background:color-mix(in srgb,var(--stamp) 7%,var(--paper))}
.sched{display:flex;flex-direction:column;align-items:flex-end;gap:2px;min-width:6.4em}
.td{background:var(--ink);color:var(--paper);border-radius:8px;padding:3px 10px;font-size:15px}
.nx{font-size:15px;font-weight:700;white-space:nowrap;font-variant-numeric:tabular-nums}
.ab{display:flex;flex-direction:column;align-items:center;font-size:12px;color:var(--stamp);white-space:nowrap}
.ab small,.nx small,.upd small{font-size:inherit}
.row.is-today>summary{border-left-width:10px}
.row.streak>summary{background:color-mix(in srgb,var(--stamp) 9%,var(--paper))}
.sk{display:inline-block;margin-top:4px;font-size:13px;font-weight:700;color:#fff;background:var(--stamp);border-radius:6px;padding:1px 8px}
.res{list-style:none;margin:14px 0 0;padding:0}
.res li{background:var(--paper);border:1px solid var(--rule);border-left:5px solid var(--c);border-radius:12px;padding:10px 12px;margin-bottom:8px}
.res .t{font-weight:700}
.res .m{font-size:13px;color:var(--sub)}
.res .chips{margin-top:6px}
.hint{color:var(--sub);font-size:14px}
footer{color:var(--sub);font-size:13px;text-align:center;padding:0 16px 30px;max-width:760px;margin:0 auto;line-height:1.7}
@media(max-width:600px){.row>summary{grid-template-columns:4.6em 1fr auto;gap:8px;padding:10px}.who b{font-size:17px}.more{padding-left:14px}.today{flex-basis:100%}.dt{font-size:26px}.tl li{grid-template-columns:4.6em 1fr}.sched{min-width:0}}
@media(prefers-reduced-motion:no-preference){.row[open] .more{animation:in .2s both}@keyframes in{from{opacity:0;transform:translateY(-4px)}}}
</style></head><body>
<div class="top">
  <div class="row1">
    <div class="today"><h1>プリント進度ボード</h1><div class="dt" id="todayDt"></div><div class="tc" id="todayCome"></div></div>
    <nav class="tabs" aria-label="表示の切りかえ"><a href="#now" id="tNow">いまどこ</a><a href="#log" id="tLog">記録</a><a href="#find" id="tFind">プリントをさがす</a></nav>
  </div>
  <div class="row2">
    <div class="seg" id="fSubj" role="group" aria-label="教科でしぼる"></div>
    <div class="seg" id="fGrade" role="group" aria-label="学年でしぼる"></div>
    <span class="stamp-t"><span id="loadedAt"></span><button class="btn" id="reload" type="button">最新にする</button><button class="btn" id="openSet" type="button">設定</button></span>
  </div>
</div>
<main id="main"><p class="hint">教材サイトから読み込み中…</p></main>
<footer>この表は、数学・英語の教材サイトのデータ（今ここの回・プリントの一覧・記録）から自動で作っています。教材サイトを更新すれば、ここにも反映されます。<br>はんこ（印刷した・木曜済など）は、教材サイトで付けたチェックです。同じ端末・同じブラウザで開いたときに表示されます。</footer>
<div class="modal" id="modal" hidden></div>
<div class="note" id="note" hidden role="status"></div>
<script>
{
/* 読みに行く教材サイト。教科を足すときはここに1つ足す */
const SRC=[
  {id:'sugaku',subj:'数学',k:'ma',base:'/sugaku/',shelf:'sugaku-shelf',ck:(t,s,c)=>`${t}/${s.id}-${c}`,tracksFallback:['u','k','n']},
  {id:'eigo',subj:'英語',k:'en',base:'/eigo/',shelf:'eigo-shelf',ck:(t,s,c)=>`${s.id}-${c}`,tracksFallback:['futari','hitori'],daysFallback:{futari:['mon','thu'],hitori:['thu']}}
];
const GRADES=['中1','中2','中3','高1','高2','高3'];
const KIND={thu:'木曜',mon:'月曜',lesson:'授業',hw:'宿題',study:'自習',teacher:'先生用'};
const $=s=>document.querySelector(s);
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toLocaleDateString('sv-SE');
const md=d=>/^\d{4}-\d\d-\d\d/.test(d||'')?(+d.slice(5,7))+'/'+(+d.slice(8,10)):'';
const WD=['日','月','火','水','木','金','土'],DK=['sun','mon','tue','wed','thu','fri','sat'];
const pd=d=>{const m=/^(\d{4})-(\d\d)-(\d\d)/.exec(d||'');return m?new Date(+m[1],m[2]-1,+m[3]):null};
const mdw=d=>{const x=pd(d);return x?`${x.getMonth()+1}/${x.getDate()}<small class="wd${x.getDay()===0?' sun':x.getDay()===6?' sat':''}">(${WD[x.getDay()]})</small>`:''};
const iso=x=>x.toLocaleDateString('sv-SE');
function nextDay(dd){if(!dd||!dd.length)return null;const t=new Date();t.setHours(0,0,0,0);for(let i=0;i<8;i++){const x=new Date(t);x.setDate(t.getDate()+i);if(dd.includes(DK[x.getDay()]))return{i,d:iso(x)}}return null}
const isAbs=l=>/^\s*休み/.test(l.text||'');
const days=d=>md(d)?Math.floor((Date.parse(today())-Date.parse(d.slice(0,10)))/864e5):null;
let F={subj:'',grade:''},Q='';
try{Object.assign(F,JSON.parse(localStorage.getItem('shindo-f')||'{}'))}catch(e){}
const saveF=()=>{try{localStorage.setItem('shindo-f',JSON.stringify(F))}catch(e){}};
let TR=[],FILES={},ERR=[],loadedAt=null,loading=true;
const OPEN=new Set();
function derive(t){t.abs=t.log.filter(isAbs);t.streak=t.log.length>1&&isAbs(t.log[0])&&isAbs(t.log[1])}

const getJ=async u=>{const r=await fetch(u,{cache:'no-store'});if(!r.ok)throw new Error(r.status+' '+u);return r.json()};
const shelf=k=>{try{return JSON.parse(localStorage.getItem(k)||'{}')||{}}catch(e){return{}}};
function gradeOf(src,id,d){
  const g=d.grade||d.badge||'';const m=(g+' '+(d.longName||'')).match(/[中高][1-3]/);
  if(m)return m[0];
  if(src.id==='sugaku'){if(/^chu2/.test(id))return'中2';if(/^chu3/.test(id))return'中3';if(/^kou1/.test(id))return'高1';if(/^kou2/.test(id))return'高2'}
  return'中1';
}
async function loadSrc(src){
  const common=await getJ(src.base+'data/common.json');
  const ids=common.tracks||src.tracksFallback;
  const steps={};
  for(const u of common.units||[]){if(u.steps)for(const s of u.steps)steps[s.id]=u.name+'　'+s.name;else steps[u.id]=u.name}
  for(const s of (common.jitsu&&common.jitsu.steps)||[])steps[s.id]='実力テスト　'+s.name;
  for(const n of common.nyushi||[])for(const s of n.steps||[])steps[s.id]=n.name+'　'+s.name;
  const lib={};
  await Promise.all((common.libraries||[]).map(async l=>{try{const d=await getJ(src.base+'data/'+l+'.json');for(const it of d.items||[])lib[it.file]=it}catch(e){ERR.push(src.subj+'：'+l+'.json を読めませんでした')}}));
  const ck=shelf(src.shelf);
  const out=await Promise.all(ids.map(async id=>{
    try{const d=await getJ(src.base+'data/'+id+'.json');return{src,id,d}}catch(e){ERR.push(src.subj+'：'+id+'.json を読めませんでした');return null}
  }));
  return out.filter(Boolean).map(({src,id,d})=>{
    const checks=d.checks||[];
    const sets=(d.sets||[]).map(s=>{
      const items=[];
      for(const g of s.groups||[])for(const it of g.items||[]){const L=lib[it.file]||{};items.push({file:it.file,title:it.title||L.title||it.file,ans:!!(it.ans||L.ans)||/_ans|answers/.test(it.file),kind:g.kind,glabel:g.label||KIND[g.kind]||'',step:L.step})}
      const st=checks.map(([c,l])=>({l,on:!!ck[src.ck(id,s,c)]}));
      return{id:s.id,label:s.label||s.id,title:s.title||'',cur:!!s.cur,steps:(s.steps||s.units||[]).map(x=>steps[x]||x),items,st,done:st.length>0&&st.every(x=>x.on)};
    });
    const upd=d.updated||common.updated||'';
    const dd=d.days||(src.daysFallback||{})[id]||null;
    const log=(d.log||[]).map(x=>({date:x.date||'',text:x.text||''}));
    return{src,id,dd,next:nextDay(dd),name:d.name||id,longName:d.longName||'',grade:gradeOf(src,id,d),now:d.now?{text:d.now.text||'',step:steps[d.now.step]||''}:null,
      sets,cur:sets.find(s=>s.cur)||sets[sets.length-1]||null,log,upd,
      url:src.base+'#'+id};
  });
}
async function load(){
  loading=true;ERR=[];render();
  const res=await Promise.all(SRC.map(async s=>{try{return await loadSrc(s)}catch(e){ERR.push(s.subj+'の教材サイトを読めませんでした（'+s.base+'）');return[]}}));
  TR=res.flat();applyPending();TR.forEach(derive);FILES={};
  for(const t of TR)for(const s of t.sets)for(const it of s.items){if(it.ans||it.kind==='teacher')continue;const key=t.src.id+'/'+it.file;(FILES[key]=FILES[key]||{title:it.title,src:t.src,step:it.step?s.steps[0]:s.steps[0],uses:[]}).uses.push({t,s})}
  loadedAt=new Date();loading=false;render();
}

const vis=t=>(!F.subj||t.src.subj===F.subj)&&(!F.grade||t.grade===F.grade);
function route(){const h=location.hash.slice(1);return h==='log'||h==='find'?h:'now'}
function toolbar(r){
  $('#tNow').toggleAttribute('aria-current',r==='now');$('#tLog').toggleAttribute('aria-current',r==='log');$('#tFind').toggleAttribute('aria-current',r==='find');
  $('#fSubj').innerHTML=`<button type="button" data-s="" aria-pressed="${!F.subj}">全教科</button>`+SRC.map(s=>`<button type="button" data-s="${s.subj}" data-k="${s.k}" aria-pressed="${F.subj===s.subj}">${s.subj}</button>`).join('');
  const gs=GRADES.filter(g=>TR.some(t=>t.grade===g));
  $('#fGrade').innerHTML=`<button type="button" data-g="" aria-pressed="${!F.grade}">全学年</button>`+gs.map(g=>`<button type="button" data-g="${g}" aria-pressed="${F.grade===g}">${g}</button>`).join('');
  const n=new Date(),w=n.getDay();
  $('#todayDt').innerHTML=`${n.getMonth()+1}月${n.getDate()}日<span class="w${w===6?' sat':''}"${w>0&&w<6?' style="color:inherit"':''}>（${WD[w]}）</span>`;
  const come=TR.filter(t=>t.next&&t.next.i===0).map(t=>t.name);
  $('#todayCome').innerHTML=TR.length?(come.length?`今日の授業：${come.map(esc).join('・')}`:'<span>今日は授業のある組はありません</span>'):'';
  $('#loadedAt').textContent=loadedAt?loadedAt.toLocaleTimeString('ja-JP',{hour:'2-digit',minute:'2-digit'})+' に読み込み':'';
}
function render(){
  const r=route();toolbar(r);const m=$('#main');
  if(loading&&!TR.length){m.innerHTML='<p class="hint">教材サイトから読み込み中…</p>';return}
  const err=ERR.length?`<div class="err">${ERR.map(esc).join('<br>')}</div>`:'';
  if(r==='find'){
    if(!$('#q')){m.innerHTML=err+`<input type="search" id="q" placeholder="プリント名・単元でさがす（例：比例、否定文）" value="${esc(Q)}"><div id="fr"></div>`;$('#q').addEventListener('input',e=>{Q=e.target.value;$('#fr').innerHTML=vFind()})}
    $('#fr').innerHTML=vFind();return;
  }
  m.innerHTML=err+(r==='log'?vLog():vNow());
}

const norm=x=>String(x||'').replace(/[\s（）()・、。：:]/g,'');
function row(t){
  const c=t.cur,u=days(t.upd);
  const prints=c?c.items.filter(it=>!it.ans&&it.kind!=='teacher'):[];
  const now=t.now&&t.now.text&&norm(t.now.text)!==norm(c&&c.title)?t.now.text:'';
  const lg=t.log[0],showLog=lg&&!norm(now+(c&&c.title)).includes(norm(lg.text).slice(0,12));
  const on=c?c.st.filter(x=>x.on):[];
  const recentAbs=t.abs.filter(a=>{const n=days(a.date);return n!==null&&n<=14}).slice(0,2);
  const key=t.src.id+'/'+t.id;
  return `<details class="row${t.next&&t.next.i===0?' is-today':''}${t.streak?' streak':''}" data-k="${t.src.k}" data-key="${esc(key)}"${OPEN.has(key)?' open':''}>
  <summary><span class="who"><b>${esc(t.name)}</b><span class="sj">${esc(t.src.subj)}</span></span>
   <span class="what">${c?`<span class="lb">${esc(c.label)}</span><span class="tt">${esc(c.title)}</span>`:'<span class="tt none">まだ教材がありません</span>'}${now?`<span class="nw">${esc(now)}</span>`:''}${t.streak?'<span class="sk">2回続けて休み</span>':''}</span>
   <span class="side">${recentAbs.map(a=>`<span class="ab"><span class="hk">休</span>${mdw(a.date)}</span>`).join('')}${c&&c.done?'<span class="hk" title="この回はチェックがすべて済">済</span>':''}
    <span class="sched">${t.next?(t.next.i===0?'<b class="td">今日</b>':`<span class="nx">次 ${mdw(t.next.d)}</span>`):''}${u!==null?`<span class="upd${u>=14?' warn':''}">${mdw(t.upd)} 更新</span>`:''}</span></span></summary>
  <div class="more">
   ${prints.length?`<ul class="prints">${prints.map(it=>`<li><span class="k">${esc(KIND[it.kind]||it.glabel)}</span><span>${esc(it.title)}</span></li>`).join('')}</ul>`:''}
   ${on.length?`<p class="mm">チェック済：${on.map(x=>esc(x.l)).join('・')}</p>`:''}
   ${t.sets.length>1?`<ul class="hl">${t.sets.slice().reverse().filter(s=>!s.cur).map(s=>`<li><span class="lb">${esc(s.label)}</span><span class="t">${esc(s.title)}</span>${s.done?'<span class="ok">済</span>':''}</li>`).join('')}</ul>`:''}
   <div class="acts"><button type="button" class="btn abs-b" data-act="abs" data-key="${esc(key)}">休み</button><button type="button" class="btn" data-act="note" data-key="${esc(key)}">記録を書く</button></div>
   ${t.log.length?`<ul class="lg">${t.log.slice(0,3).map((l,i)=>`<li><span class="d">${mdw(l.date)}</span><span class="x">${isAbs(l)?'<span class="hk">休</span>':''}${esc(l.text)}</span><button type="button" class="x-b" data-act="del" data-key="${esc(key)}" data-i="${i}" aria-label="この記録を消す">消す</button></li>`).join('')}</ul>`:''}
   <a class="open" href="${esc(t.url)}">教材サイトで開く →</a>
  </div></details>`;
}
function vNow(){
  const list=TR.filter(vis);
  if(!list.length)return '<p class="hint">この条件の組はありません</p>';
  return GRADES.filter(g=>list.some(t=>t.grade===g)).map(g=>{const a=list.filter(t=>t.grade===g);return `<section class="grade"><h2>${g}</h2><div class="rows">${a.map(row).join('')}</div></section>`}).join('')
   +'<p class="hint" style="text-align:center">行をタップすると、プリントの中身とこれまでの回が開きます。</p>';
}
function vLog(){
  const rows=[];
  for(const t of TR.filter(vis))for(const l of t.log)rows.push({...l,t});
  rows.sort((a,b)=>String(b.date).localeCompare(String(a.date)));
  const noLog=TR.filter(vis).filter(t=>!t.log.length).map(t=>t.name);
  const by={};rows.slice(0,200).forEach(r=>(by[r.date]=by[r.date]||[]).push(r));
  return (rows.length?Object.entries(by).map(([d,rs])=>{const x=pd(d);return `<section class="day"><h2>${x?`${x.getMonth()+1}月${x.getDate()}日<span class="wd${x.getDay()===0?' sun':x.getDay()===6?' sat':''}">（${WD[x.getDay()]}）</span>`:'日付なし'}${d===today()?'<span class="tdl">今日</span>':''}</h2>
    <ul class="tl">${rs.map(r=>`<li data-k="${r.t.src.k}" class="${isAbs(r)?'abs':''}"><span class="w">${esc(r.t.name)}<small>${esc(r.t.src.subj)}</small></span><span class="x">${isAbs(r)?'<span class="hk">休</span>':''}${esc(r.text)}</span></li>`).join('')}</ul></section>`}).join(''):'<p class="hint">記録はまだありません</p>')
   +(noLog.length?`<p class="hint">記録（log）がまだない組：${noLog.map(esc).join('、')}。</p>`:'');
}
function vFind(){
  const q=Q.trim().toLowerCase();
  if(!q)return '<p class="hint">プリントの名前や単元を入れると、そのプリントを「どの組が・何回目に」使ったかが出ます。</p>';
  const hits=Object.values(FILES).filter(f=>(!F.subj||f.src.subj===F.subj)&&(f.title+' '+(f.step||'')).toLowerCase().includes(q)).slice(0,80);
  if(!hits.length)return '<p class="hint">見つかりませんでした</p>';
  return `<ul class="res">${hits.map(f=>`<li data-k="${f.src.k}"><div class="t">${esc(f.title)}</div><div class="m">${esc(f.src.subj)}${f.step?'・'+esc(f.step):''}</div><div class="chips">${f.uses.filter(u=>!F.grade||u.t.grade===F.grade).map(u=>`<span class="chip${u.s.cur?' cur':u.s.done?' done':''}">${esc(u.t.name)} ${esc(u.s.label)}${u.s.cur?'（今）':u.s.done?' 済':''}</span>`).join('')}</div></li>`).join('')}</ul>`;
}

$('#fSubj').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;F.subj=b.dataset.s;saveF();render()});
$('#fGrade').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;F.grade=b.dataset.g;saveF();render()});
/* ---------- 書きこみ（GitHub の教材棚へ） ---------- */
const OWNER='morihayashi-juku',TK='shindo-gh-token',PK='shindo-pending';
const tok=()=>{try{return localStorage.getItem(TK)||''}catch(e){return''}};
const b64d=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,'')),c=>c.charCodeAt(0)));
const b64e=s=>{const b=new TextEncoder().encode(s);let x='';for(let i=0;i<b.length;i+=0x8000)x+=String.fromCharCode.apply(null,b.subarray(i,i+0x8000));return btoa(x)};
const gh=(path,opt={})=>fetch('https://api.github.com'+path,{...opt,cache:'no-store',headers:{Accept:'application/vnd.github+json',Authorization:'Bearer '+tok(),'X-GitHub-Api-Version':'2022-11-28',...(opt.body?{'Content-Type':'application/json'}:{})}});
async function editTrack(t,fn,msg){
  const path=`/repos/${OWNER}/${t.src.id}/contents/data/${t.id}.json`;
  for(let k=0;k<3;k++){
    const r=await gh(path+'?ref=main');
    if(r.status===401)throw new Error('鍵が使えません（まちがい・期限切れ）。設定から入れ直してください。');
    if(!r.ok)throw new Error('教材棚のデータを読めませんでした（'+r.status+'）');
    const j=await r.json(),raw=b64d(j.content),d=JSON.parse(raw);
    fn(d);d.updated=today();
    const out=JSON.stringify(d,null,1)+(raw.endsWith('\n')?'\n':'');
    const w=await gh(path,{method:'PUT',body:JSON.stringify({message:msg,content:b64e(out),sha:j.sha,branch:'main'})});
    if(w.ok)return d;
    if(w.status===409||w.status===422){await new Promise(z=>setTimeout(z,800));continue}
    if(w.status===401||w.status===403||w.status===404)throw new Error('この鍵では'+t.src.subj+'の教材棚に書きこめません。鍵の「Repository access」に '+t.src.id+'、「Contents」に Read and write が入っているか確かめてください。');
    throw new Error('書きこめませんでした（'+w.status+'）');
  }
  throw new Error('ほかの書きこみと重なりました。少し待ってもう一度押してください。');
}
/* 書きこんだ直後はサイトの反映に1〜2分かかるので、その間はこの端末で覚えておいて重ねる */
const pend=()=>{try{return JSON.parse(localStorage.getItem(PK)||'[]').filter(p=>Date.now()-p.at<15*60e3)}catch(e){return[]}};
const savePend=a=>{try{localStorage.setItem(PK,JSON.stringify(a))}catch(e){}};
function applyPending(){
  for(const p of pend()){const t=TR.find(x=>x.src.id===p.src&&x.id===p.id);if(!t)continue;
    const i=t.log.findIndex(l=>l.date===p.e.date&&l.text===p.e.text);
    if(p.op==='add'&&i<0)t.log.unshift({...p.e});if(p.op==='del'&&i>=0)t.log.splice(i,1);
    if(p.upd)t.upd=p.upd;}
}
const fk=k=>TR.find(t=>t.src.id+'/'+t.id===k);
async function addLog(t,e){
  const d=await editTrack(t,d=>{d.log=Array.isArray(d.log)?d.log:[];d.log.unshift(e)},`記録（進度ボード）：${t.name} ${e.date} ${e.text.slice(0,30)}`);
  t.log=(d.log||[]).map(x=>({date:x.date||'',text:x.text||''}));t.upd=d.updated;derive(t);
  savePend([...pend(),{op:'add',src:t.src.id,id:t.id,e,upd:d.updated,at:Date.now()}]);
}
async function delLog(t,e){
  const d=await editTrack(t,d=>{const i=(d.log||[]).findIndex(l=>l.date===e.date&&l.text===e.text);if(i<0)throw new Error('その記録はもう消えています');d.log.splice(i,1)},`記録を消す（進度ボード）：${t.name} ${e.date}`);
  t.log=(d.log||[]).map(x=>({date:x.date||'',text:x.text||''}));t.upd=d.updated;derive(t);
  savePend([...pend().filter(p=>!(p.op==='add'&&p.src===t.src.id&&p.id===t.id&&p.e.date===e.date&&p.e.text===e.text)),{op:'del',src:t.src.id,id:t.id,e,at:Date.now()}]);
}

/* ---------- 画面の小窓 ---------- */
const M=$('#modal');let nt;
function note(x){const n=$('#note');n.textContent=x;n.hidden=false;clearTimeout(nt);nt=setTimeout(()=>n.hidden=true,4000)}
function openModal(html,submit){
  M.innerHTML=`<form class="panel" novalidate>${html}<p class="err-m" id="mErr" hidden></p></form>`;M.hidden=false;
  const f=M.firstElementChild;
  f.addEventListener('submit',async ev=>{ev.preventDefault();const b=f.querySelector('.pri'),m=f.querySelector('#mErr');m.hidden=true;b.disabled=true;const o=b.textContent;b.textContent='書きこみ中…';
    try{await submit(f);closeModal();render()}catch(e){m.textContent=e.message||String(e);m.hidden=false}finally{b.disabled=false;b.textContent=o}});
  f.addEventListener('click',e=>{if(e.target.closest('[data-close]'))closeModal()});
  return f;
}
function closeModal(){M.hidden=true;M.innerHTML=''}
M.addEventListener('click',e=>{if(e.target===M)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!M.hidden)closeModal()});
const btns=l=>`<div class="mb"><button type="button" class="btn" data-close>やめる</button><button class="btn pri">${l}</button></div>`;
function lastLesson(t){if(!t.dd)return today();const x=new Date();x.setHours(0,0,0,0);for(let i=0;i<8;i++){const y=new Date(x);y.setDate(x.getDate()-i);if(t.dd.includes(DK[y.getDay()]))return iso(y)}return today()}
function needTok(){if(tok())return false;openSettings('記録を書きこむには、最初に1回だけ鍵を入れます。');return true}
function openAbs(t){
  if(needTok())return;
  openModal(`<h2><span style="color:var(--c)">${esc(t.name)}</span> の休み</h2><p class="mh">${esc(t.src.subj)}の教材棚の記録に「休み」と書きこみます。回は進めません。</p>
  <label>休んだ日<input type="date" name="date" value="${lastLesson(t)}" required></label>
  <label>理由（なくてもよい）<input type="text" name="why" placeholder="例：体調不良、家の用事" autocomplete="off"></label>
  <label>どうするか（なくてもよい）<input type="text" name="plan" placeholder="例：この回はそのまま次の授業に" autocomplete="off"></label>
  ${/人/.test(t.name)?'<p class="mh">何人かの組で1人だけ休んだときは、理由の欄に「1人：呼び名」と書いてください（本名は書かない）。</p>':''}
  ${btns('休みを記録する')}`,async f=>{
    const date=f.date.value||today(),why=f.why.value.trim(),plan=f.plan.value.trim();
    const text='休み'+(why?`（${why}）`:'')+'。'+(plan?plan+(/[。．]$/.test(plan)?'':'。'):'');
    await addLog(t,{date,text});note(`${t.name}：${md(date)} 休みを記録しました`);
  });
}
function openNote(t){
  if(needTok())return;
  openModal(`<h2><span style="color:var(--c)">${esc(t.name)}</span> の記録</h2><p class="mh">${esc(t.src.subj)}の教材棚の記録の一番上に書きこみます。</p>
  <label>日付<input type="date" name="date" value="${today()}" required></label>
  <label>記録<textarea name="text" rows="3" placeholder="例：⑥ A を終えた。16問中12問。×÷の順番はできてきた" required></textarea></label>
  <p class="mh">公開サイトに残るので、本名は書かないでください。</p>
  ${btns('記録する')}`,async f=>{
    const text=f.text.value.trim();if(!text)throw new Error('記録を書いてください');
    await addLog(t,{date:f.date.value||today(),text});note(`${t.name}：記録しました`);
  });
}
function openDel(t,i){
  const e=t.log[i];if(!e)return;if(needTok())return;
  openModal(`<h2>この記録を消しますか？</h2><p class="mh">${mdw(e.date)}　${esc(e.text)}</p>${btns('消す')}`,async()=>{await delLog(t,e);note('記録を消しました')});
}
function openSettings(lead){
  const has=!!tok();
  const f=openModal(`<h2>設定：書きこみの鍵</h2>${lead?`<p class="mh"><b>${esc(lead)}</b></p>`:''}
  <p class="mh">今：${has?'<b>鍵が入っています</b>（この端末だけ）':'鍵は入っていません'}</p>
  <details class="howto"${has?'':' open'}><summary>鍵の作り方（最初の1回だけ）</summary><ol>
   <li>この端末のブラウザで <a href="https://github.com/settings/personal-access-tokens/new">GitHub の「新しい鍵を作る」ページ</a> を開く（ログインを聞かれたらログイン）。</li>
   <li><b>Token name</b>：「進度ボード（iPad）」「進度ボード（Mac）」のように、端末の名前を入れる。<b>Expiration</b>：Custom で1年後の日付。</li>
   <li><b>Resource owner</b>：morihayashi-juku のまま。</li>
   <li><b>Repository access</b>：「Only select repositories」→ <b>sugaku</b> と <b>eigo</b> の2つを選ぶ。</li>
   <li><b>Permissions</b> →「Repository permissions」→ <b>Contents</b> を「<b>Read and write</b>」にする（Metadata は自動で Read-only になる）。</li>
   <li>いちばん下の <b>Generate token</b> → 出てきた <code>github_pat_</code> で始まる文字をコピーして、下に貼る。この文字は二度と表示されないので、ここに貼ったら閉じてよい。</li>
  </ol><p class="mh">鍵はこの端末のこのブラウザの中だけにしまわれ、GitHubのページには載りません。端末をなくしたときは、GitHub の Settings → Developer settings → Fine-grained tokens で、その端末の鍵を Delete してください。</p></details>
  <label>鍵（github_pat_…）<input type="password" name="tk" autocomplete="off" placeholder="${has?'入れ直すときだけ貼る':'ここに貼る'}"></label>
  <div class="mb">${has?'<button type="button" class="btn" id="tkDel">鍵を消す</button>':''}<button type="button" class="btn" data-close>閉じる</button><button class="btn pri">保存して確かめる</button></div>`,async f=>{
    const v=f.tk.value.trim();if(!v){if(has)return;throw new Error('鍵を貼ってください')}
    if(!/^(github_pat_|ghp_)/.test(v))throw new Error('github_pat_ で始まる文字を貼ってください');
    const old=tok();try{localStorage.setItem(TK,v)}catch(e){throw new Error('この端末に保存できませんでした')}
    const r=await gh(`/repos/${OWNER}/sugaku/contents/data/common.json?ref=main`);
    if(r.status===401){try{old?localStorage.setItem(TK,old):localStorage.removeItem(TK)}catch(e){}throw new Error('この鍵は使えませんでした。コピーし直して貼ってください。')}
    note('鍵を保存しました。最初に書きこんだときに、書きこめるか確かめます');
  });
  const d=f.querySelector('#tkDel');if(d)d.addEventListener('click',()=>{try{localStorage.removeItem(TK)}catch(e){}closeModal();note('鍵を消しました')});
}
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(!b||M.contains(b))return;const t=fk(b.dataset.key);if(!t)return;
  if(b.dataset.act==='abs')openAbs(t);else if(b.dataset.act==='note')openNote(t);else if(b.dataset.act==='del')openDel(t,+b.dataset.i)});
document.addEventListener('toggle',e=>{const d=e.target;if(d.classList&&d.classList.contains('row')){d.open?OPEN.add(d.dataset.key):OPEN.delete(d.dataset.key)}},true);
$('#openSet').addEventListener('click',()=>openSettings());
$('#reload').addEventListener('click',load);
addEventListener('hashchange',()=>{render();scrollTo(0,0)});
addEventListener('pageshow',e=>{if(e.persisted)load()});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&loadedAt&&Date.now()-loadedAt>60000)load()});
load();
}
